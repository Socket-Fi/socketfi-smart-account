name: Verified contract release

on:
  workflow_dispatch:
  push:
    tags: ['contracts-v*']

permissions:
  contents: read

concurrency:
  group: verified-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Socket-Fi/socketfi-smart-account' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/contracts-v'))
    strategy:
      fail-fast: true
      matrix:
        replica: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test release tooling
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Build from the committed source in the pinned container
        run: python3 -B scripts/release.py build --output artifacts/candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ matrix.replica }}
          path: artifacts/candidate/*
          if-no-files-found: error
          retention-days: 14

  attest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: candidate-*
          path: artifacts/candidates
      - name: Require identical source, configuration, and WASM hashes
        run: >-
          python3 -B scripts/release.py compare
          --first artifacts/candidates/candidate-1
          --second artifacts/candidates/candidate-2
          --output artifacts/verified-release
          --commit "$GITHUB_SHA"
      - name: Attest the final artifacts and source archive
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: artifacts/verified-release/SHA256SUMS
          create-storage-record: false
      - name: Preserve the verification bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" artifacts/verified-release/attestation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: socketfi-verified-${{ github.sha }}
          path: artifacts/verified-release/*
          if-no-files-found: error
          retention-days: 90
