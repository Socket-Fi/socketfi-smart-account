[workspace]
members = ["account", "factory", "shared", "access", "upgrade"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.91.0"
publish = false

[workspace.dependencies]
soroban-sdk = "=25.3.1"
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa"] }
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
